# Configurazione nginx del servizio FRONTEND.
#
# nginx fa due cose: serve le due pagine statiche e fa da **reverse proxy**
# verso il backend per tutto ciò che sta sotto /api/.
#
# Perché il proxy invece di far chiamare il backend direttamente dal browser:
# separando il frontend in un servizio a sé, le pagine verrebbero servite da
# un'origine (localhost:8080) diversa da quella dell'API (localhost:8000), e
# ogni fetch sarebbe cross-origin — quindi CORS da configurare, preflight da
# gestire, e l'URL del backend da iniettare nel JavaScript. Con il proxy,
# browser e pagine vedono una sola origine e il codice JavaScript resta
# identico a quello che gira in sviluppo locale, dove è FastAPI a servire
# tutto. Zero differenze di comportamento tra i due ambienti.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Le due interfacce. Sono file statici distinti, non una SPA con routing
    # lato client, quindi ogni rotta punta esplicitamente al proprio file.
    location = / {
        try_files /index.html =404;
    }

    location = /agent {
        try_files /agent.html =404;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # API: inoltrate al backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'interfaccia utente fa polling ogni 3 secondi mentre attende che un
        # operatore risolva il ticket, e un ticket può restare in coda a lungo:
        # timeout generosi evitano che il proxy chiuda connessioni legittime.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Le richieste al backend non passano di qui, ma un healthcheck sì.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
