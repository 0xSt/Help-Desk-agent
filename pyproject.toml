[project]
name = "helpdesk-hitl"
version = "0.1.0"
description = "Help desk IT con agente AI, retrieval su due knowledge base e human-in-the-loop"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=1.0",
    # Non importato direttamente dal nostro codice, ma richiesto da
    # mlflow.langchain.autolog() per strumentare l'esecuzione del grafo.
    "langchain>=1.0",
    "pydantic>=2.0",
    "qdrant-client>=1.9",
    "google-genai>=1.0",
    "mlflow>=3.0",
    # Necessaria agli scorer di eval_suite. Come giudice MLflow supporta
    # nativamente pochi provider (OpenAI, Anthropic, Bedrock, Mistral) e
    # instrada tutti gli altri, Gemini compreso, tramite LiteLLM: senza questa
    # dipendenza `gemini:/<modello>` non è utilizzabile e MLflow ricadrebbe sul
    # provider predefinito, che è OpenAI. Sta fra le dipendenze principali e
    # non in un extra perché l'immagine del backend installa solo queste, ed è
    # da quell'immagine che si esegue la valutazione nei container.
    "litellm>=1.0",
]

[project.optional-dependencies]
# Non utilizzato dal servizio né dalla suite di valutazione: resta disponibile
# per chi volesse confrontare le metriche native di MLflow con quelle di RAGAS.
# Impone `langchain-community<0.4`, perché RAGAS importa ancora un modulo
# rimosso dalle versioni successive: va quindi installato in un ambiente
# separato, con `uv sync --extra ragas`.
ragas = [
    "ragas>=0.4",
    "langchain-community<0.4",
    "pandas>=2.0",
]

[tool.uv]
# Il lockfile va committato: è ciò che rende le build riproducibili tra la
# macchina di sviluppo e i container.
package = false
